# ~~ Generated by projen. To modify, edit .projenrc.ts and run "npx projen".

name: release-gh-packages
on:
  push:
    branches:
      - distribution
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.x
          registry-url: https://npm.pkg.github.com
          scope: "@Andrew-Chemis"
      - name: Require the ac-v0.1.0 baseline tag
        run: |-
          git rev-parse --verify --quiet refs/tags/ac-v0.1.0 >/dev/null || { echo "::error::tag ac-v0.1.0 is missing; semantic-release would publish 1.0.0"; exit 1; }
          git merge-base --is-ancestor ac-v0.1.0 HEAD || { echo "::error::ac-v0.1.0 is not an ancestor of HEAD"; exit 1; }
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: node_modules/.bin/projen build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node_modules/.bin/semantic-release
